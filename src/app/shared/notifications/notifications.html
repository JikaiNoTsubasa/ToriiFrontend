<div class="toasts" role="status" aria-live="polite">
  @for (n of items(); track n.id) {
    <div class="toast toast--{{ n.kind }}">
      <div class="toast__body">
        <span class="toast__title">{{ n.title }}</span>
        @if (n.detail) {
          <span class="toast__detail">{{ n.detail }}</span>
        }
        @if (n.link; as link) {
          <a class="toast__link" [routerLink]="link.commands" [queryParams]="link.queryParams" (click)="dismiss(n.id)">
            {{ link.label }} <i class="fas fa-arrow-right" aria-hidden="true"></i>
          </a>
        }
      </div>
      <button
        class="toast__close"
        type="button"
        (click)="dismiss(n.id)"
        aria-label="Dismiss notification"
      >
        ×
      </button>
    </div>
  }
</div>
