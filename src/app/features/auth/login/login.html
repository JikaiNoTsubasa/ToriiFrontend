<div class="login">
  <form class="panel login__panel" novalidate (submit)="submit($event)">
    <h1 class="login__title"><img src="/Torii_logo.png" alt="Torii Logo" width="64" height="64" /><br/>Torii</h1>

    @if (error(); as message) {
      <div class="alert alert--error">{{ message }}</div>
    }
    @if (notice(); as n) {
      <div class="alert" [class.alert--info]="n.kind === 'pending'" [class.alert--error]="n.kind === 'rejected'" role="status">
        <strong class="alert__title">
          <i class="fas" [class.fa-user-clock]="n.kind === 'pending'" [class.fa-user-slash]="n.kind === 'rejected'" aria-hidden="true"></i>
          {{ n.title }}
        </strong>
        {{ n.detail }}
      </div>
    }

    <label class="field">
      <span>Email</span>
      <input type="email" [formField]="form.email" autocomplete="email" />
    </label>

    <label class="field">
      <span>Password</span>
      <input type="password" [formField]="form.password" autocomplete="current-password" />
    </label>

    <button class="btn" type="submit" [disabled]="loading()">
      {{ loading() ? 'Signing in…' : 'Sign in' }}
    </button>

    @if (singpass.value().enabled) {
      <div class="login__divider"><span>or</span></div>

      @if (singpassError(); as message) {
        <div class="alert alert--error">{{ message }}</div>
      }
      <button class="btn btn--singpass" type="button" [disabled]="redirecting()" (click)="withSingpass()">
        <i class="fas fa-id-card" aria-hidden="true"></i>
        {{ redirecting() ? 'Redirecting to Singpass…' : 'Sign in with Singpass' }}
      </button>
    }

    <p class="login__footer text-muted">
      No account yet? <a routerLink="/register">Create an account</a>
    </p>
  </form>
</div>
