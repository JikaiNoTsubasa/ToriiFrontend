<button
  class="notification-bell__toggle"
  type="button"
  aria-haspopup="dialog"
  [attr.aria-expanded]="open()"
  [attr.aria-label]="unreadCount() ? unreadCount() + ' unread notifications' : 'Notifications'"
  [class.notification-bell__toggle--open]="open()"
  (click)="toggle()"
>
  <i class="fas fa-bell" aria-hidden="true"></i>
  @if (unreadCount()) {
    <span class="notification-bell__badge" aria-hidden="true">{{ unreadCount() > 99 ? '99+' : unreadCount() }}</span>
  }
</button>

@if (open()) {
  <div
    class="notification-panel"
    role="dialog"
    aria-label="Notifications"
    animate.enter="notification-panel--enter"
    animate.leave="notification-panel--leave"
  >
    <header class="notification-panel__head">
      <h2 class="notification-panel__title">Notifications</h2>
      <button class="btn btn--ghost btn--sm" type="button" [disabled]="!unreadCount()" (click)="markAllRead()">
        <i class="fas fa-check-double" aria-hidden="true"></i> Mark all as read
      </button>
    </header>

    @if (loading() && !items().length) {
      <p class="notification-panel__empty text-muted">Loading…</p>
    } @else if (!items().length) {
      <div class="notification-panel__empty">
        <i class="fas fa-bell-slash" aria-hidden="true"></i>
        <p>You're all caught up.</p>
        <p class="text-muted">Replies to your tickets will show up here.</p>
      </div>
    } @else {
      <ul class="notification-panel__list">
        @for (n of items(); track n.id) {
          <li>
            <button
              class="notification-item"
              type="button"
              [class.notification-item--unread]="!n.readAt"
              (click)="openNotification(n)"
            >
              <img class="notification-item__avatar" [src]="n.actor.avatarUrl" alt="" />
              <span class="notification-item__body">
                <span class="notification-item__line">
                  <strong>{{ n.actor.displayName }}</strong>
                  {{ action(n) }}
                  @if (n.count > 1) {
                    <span class="notification-item__count">+{{ n.count - 1 }} more</span>
                  }
                </span>
                @if (n.ticketNumber) {
                  <span class="notification-item__ticket">
                    <span class="table__code">{{ n.ticketNumber }}</span> {{ n.ticketTitle }}
                  </span>
                }
                @if (n.preview) {
                  <span class="notification-item__preview text-muted">{{ n.preview }}</span>
                }
                <span class="notification-item__meta text-muted">
                  @if (n.counterpart) {
                    With {{ n.counterpart }} ·
                  }
                  <time [attr.datetime]="n.createdAt">{{ timeAgo(n.createdAt) }}</time>
                </span>
              </span>
              @if (!n.readAt) {
                <span class="notification-item__dot" aria-label="Unread"></span>
              }
            </button>
          </li>
        }
      </ul>
    }
  </div>
}
